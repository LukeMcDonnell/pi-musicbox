<!-- More below than above: the gap is what separates one shelf from the next. -->
<section class="pt-2 pb-6">
  <div class="flex items-baseline gap-3 pb-2">
    <h2 class="text-lg font-bold">{{ heading() }}</h2>
    @if (link(); as target) {
      <a class="ms-auto flex min-h-11 items-center px-1 text-[0.85rem] font-semibold text-muted
                select-none touch-manipulation active:text-accent"
         [routerLink]="target">{{ linkLabel() }}</a>
    }
  </div>

  <!-- The group is this wrapper, not the section: hovering the heading is not
       hovering the row. The buttons centre on the middle of the square cover —
       half a card's width down — not on the rail, whose height includes the two
       lines of text under it. Their shadow is spelled out rather than `shadow-lg`:
       the default scale is black at 0.1, which is nothing on a near-black page. -->
  <div class="group/shelf relative">
    <!-- overscroll-x-contain: a fling that runs out here must not become a page swipe. -->
    <div #rail class="no-scrollbar flex snap-x snap-mandatory gap-3 overflow-x-auto
                      overscroll-x-contain"
         (scroll)="measure()">
      <ng-content />
    </div>

    @if (overflows()) {
      <button type="button"
              class="absolute start-0 top-[calc(var(--spacing-card)/2)] grid size-11
                     -translate-y-1/2 cursor-pointer touch-manipulation place-items-center
                     rounded-full bg-white/90 text-bg shadow-[0_2px_10px_rgb(0_0_0/0.75)]
                     select-none active:bg-white/70 disabled:invisible
                     fine:opacity-0 fine:focus-visible:opacity-100 fine:group-hover/shelf:opacity-100"
              [disabled]="!canScrollLeft()" aria-label="Scroll left"
              (click)="scrollBy(-1)">
        <svg lucideChevronLeft class="size-6" aria-hidden="true"></svg>
      </button>
      <button type="button"
              class="absolute end-0 top-[calc(var(--spacing-card)/2)] grid size-11
                     -translate-y-1/2 cursor-pointer touch-manipulation place-items-center
                     rounded-full bg-white/90 text-bg shadow-[0_2px_10px_rgb(0_0_0/0.75)]
                     select-none active:bg-white/70 disabled:invisible
                     fine:opacity-0 fine:focus-visible:opacity-100 fine:group-hover/shelf:opacity-100"
              [disabled]="!canScrollRight()" aria-label="Scroll right"
              (click)="scrollBy(1)">
        <svg lucideChevronRight class="size-6" aria-hidden="true"></svg>
      </button>
    }
  </div>
</section>
