@if (cd(); as disc) {
  <section aria-label="Audio CD" class="mb-4 flex items-center gap-4 rounded-md bg-surface p-3">
    <span class="grid size-14 flex-none place-items-center rounded-md bg-raised">
      <svg lucideDisc3 class="size-8 text-muted" aria-hidden="true"></svg>
    </span>
    <span class="min-w-0 flex-1">
      <span class="block truncate text-[1.1rem] font-bold">Audio CD</span>
      <span class="block truncate text-[0.9rem] text-muted">
        {{ disc.tracks }} {{ disc.tracks === 1 ? 'track' : 'tracks' }}{{ playing() ? ' · playing' : '' }}
      </span>
    </span>
    @if (!playing()) {
      <button class="inline-flex h-11 flex-none cursor-pointer touch-manipulation items-center gap-1.5
                     rounded-full bg-accent px-4 font-semibold text-on-accent select-none active:bg-raised"
              (click)="play()">
        <svg lucidePlay class="size-5 fill-current" aria-hidden="true"></svg>
        Play
      </button>
    }
    <button class="inline-flex h-11 flex-none cursor-pointer touch-manipulation items-center gap-1.5
                   rounded-full border border-muted bg-transparent px-4 font-semibold text-muted
                   select-none active:bg-raised"
            (click)="eject()">
      <svg lucideEject class="size-5" aria-hidden="true"></svg>
      Eject
    </button>
  </section>
  @if (error(); as message) {
    <p class="-mt-2 mb-4 text-[0.9rem] text-warn" role="alert">{{ message }}</p>
  }
}
