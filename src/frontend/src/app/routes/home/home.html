<section aria-label="Home" class="px-4 py-3 pt-0">
  <div class="sticky top-0 z-1 bg-bg py-2">
    <h1 class="text-2xl font-bold">Home</h1>
  </div>

  @if (loading()) {
    <p class="pt-3 text-[0.95rem] text-muted">Loading favourites…</p>
  } @else if (empty()) {
    <p class="py-6 text-[0.95rem] text-muted">
      No favourites yet. Tap the heart on an album to add it here.
    </p>
  } @else {
    <app-shelf heading="From your Favourites" link="/favourites">
      @for (album of albums(); track trackKey(album)) {
        <app-album-card [album]="album" [cover]="coverOf(album)"
                        (failed)="onCoverError($event)" (open)="open(album)" />
      }
    </app-shelf>
  }
</section>
