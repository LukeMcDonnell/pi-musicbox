<!-- Two sizes, switched at the same breakpoint as the frame: larger items on the
     rail, where there is height to spare, and smaller ones in the row, which has
     to fit in the 55px `tabs` height. The row stays at 44px minimum for touch. -->
<nav class="flex h-full flex-col items-stretch gap-2 py-3
            max-[46rem]:flex-row max-[46rem]:justify-around max-[46rem]:gap-1 max-[46rem]:px-2
            max-[46rem]:py-0"
     aria-label="Main menu">
  <a class="flex min-h-11 min-w-11 flex-col items-center justify-center gap-1.5 py-3 text-muted
            select-none touch-manipulation active:bg-raised aria-[current=page]:text-accent
            max-[46rem]:flex-1 max-[46rem]:gap-0.5 max-[46rem]:py-1"
     routerLink="/home" routerLinkActive ariaCurrentWhenActive="page">
    <svg lucideHouse class="size-7 max-[46rem]:size-5" aria-hidden="true"></svg>
    <span class="text-[0.8rem] font-semibold max-[46rem]:text-[0.65rem]">Home</span>
  </a>
  <a class="flex min-h-11 min-w-11 flex-col items-center justify-center gap-1.5 py-3 text-muted
            select-none touch-manipulation active:bg-raised aria-[current=page]:text-accent
            max-[46rem]:flex-1 max-[46rem]:gap-0.5 max-[46rem]:py-1"
     routerLink="/library" routerLinkActive ariaCurrentWhenActive="page">
    <svg lucideLibraryBig class="size-7 max-[46rem]:size-5" aria-hidden="true"></svg>
    <span class="text-[0.8rem] font-semibold max-[46rem]:text-[0.65rem]">Library</span>
  </a>
  <a class="flex min-h-11 min-w-11 flex-col items-center justify-center gap-1.5 py-3 text-muted
            select-none touch-manipulation active:bg-raised aria-[current=page]:text-accent
            max-[46rem]:flex-1 max-[46rem]:gap-0.5 max-[46rem]:py-1"
     routerLink="/favourites" routerLinkActive ariaCurrentWhenActive="page">
    <svg lucideHeart class="size-7 max-[46rem]:size-5" aria-hidden="true"></svg>
    <span class="text-[0.8rem] font-semibold max-[46rem]:text-[0.65rem]">Favourites</span>
  </a>
  <a class="flex min-h-11 min-w-11 flex-col items-center justify-center gap-1.5 py-3
            text-muted select-none touch-manipulation active:bg-raised
            aria-[current=page]:text-accent
            max-[46rem]:mt-0 max-[46rem]:flex-1 max-[46rem]:gap-0.5 max-[46rem]:py-1"
     routerLink="/settings" routerLinkActive ariaCurrentWhenActive="page">
    <svg lucideSettings class="size-7 max-[46rem]:size-5" aria-hidden="true"></svg>
    <span class="text-[0.8rem] font-semibold max-[46rem]:text-[0.65rem]">Settings</span>
  </a>
  <!-- Short screens only, where it stands in for the mini bar: see the `short`
       variant in styles.scss. Last, so on the rail it sits under Settings at the
       bottom, and in the row it is the far-right cell. -->
  <app-now-playing-micro class="mt-auto hidden short:block max-[46rem]:flex-1" />
</nav>
