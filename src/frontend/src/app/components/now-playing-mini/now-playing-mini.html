@if (artUri(); as uri) {
  <!-- The same backdrop as now-playing, at the same size: viewport-sized and
       anchored to the bottom, with the host clipping it to a strip. So the bar
       shows the bottom edge of the very image the full view shows — see
       art-backdrop in styles.scss for why it cannot simply be bar-sized.
       Failure is handled by the thumbnail's (error): it clears artUri, which
       removes both. -->
  <img class="art-backdrop pointer-events-none absolute inset-x-0 bottom-0 h-dvh w-full object-cover
              will-change-transform"
       [src]="uri" alt="" aria-hidden="true">
}

<div class="relative flex h-full items-center gap-1 border-t border-raised pr-2">
  <button class="flex h-full min-w-0 flex-1 cursor-pointer touch-manipulation items-center gap-3
                 p-2 text-left select-none active:bg-raised"
          (click)="open.emit()" aria-label="Open now playing">
    <!-- Fixed box, so a cover arriving or failing never shifts the text. Square
         and the full height inside the button's p-2, so the margin above and
         below the cover matches the one to its left at either bar height (see
         the `bar` token in styles.scss). -->
    <span class="grid aspect-square h-full flex-none place-items-center overflow-hidden rounded bg-raised">
      @if (artUri(); as uri) {
        <img class="h-full w-full object-cover" [src]="uri" alt=""
             width="69" height="69" (error)="onArtError(uri)">
      } @else if (onBluetooth()) {
        <svg lucideBluetooth class="size-6 text-muted" aria-hidden="true"></svg>
      } @else {
        <svg lucideMusic class="size-6 text-muted" aria-hidden="true"></svg>
      }
    </span>

    <span class="min-w-0 flex-1">
      @if (track(); as t) {
        <span class="block truncate font-semibold">{{ trackTitle() }}</span>
        @if (error(); as message) {
          <span class="block truncate text-[0.85rem] text-warn" role="alert">{{ message }}</span>
        } @else {
          <span class="block truncate text-[0.85rem] text-accent">
            {{ t.artist || 'Unknown artist' }}
          </span>
        }
      } @else {
        <span class="block truncate text-muted">{{ statusLine() }}</span>
      }
    </span>
  </button>

  <button class="inline-flex size-12 flex-none cursor-pointer touch-manipulation items-center
                 justify-center rounded-full bg-accent text-on-accent select-none active:bg-raised
                 disabled:opacity-40"
          (click)="toggle()" [disabled]="controlsDisabled()"
          [attr.aria-label]="playing() ? 'Pause' : 'Play'">
    @if (playing()) {
      <svg lucidePause class="size-6 fill-current" aria-hidden="true"></svg>
    } @else {
      <svg lucidePlay class="size-6 fill-current" aria-hidden="true"></svg>
    }
  </button>
  <button class="inline-flex size-12 flex-none cursor-pointer touch-manipulation items-center
                 justify-center rounded-full text-text select-none active:bg-raised
                 disabled:opacity-40"
          (click)="command('next')" [disabled]="controlsDisabled()" aria-label="Next track">
    <svg lucideSkipForward class="size-6 fill-current" [strokeWidth]="2.5" aria-hidden="true"></svg>
  </button>
</div>
