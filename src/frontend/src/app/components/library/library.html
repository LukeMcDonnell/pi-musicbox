<section class="px-4 py-3" aria-label="Library">
  <h1 class="text-2xl font-bold">Library</h1>

  @if (error(); as message) {
    <p class="pt-3 text-[0.9rem] text-warn" role="alert">{{ message }}</p>
    <button class="mt-3 min-h-11 cursor-pointer touch-manipulation rounded-full border
                   border-muted px-[0.9rem] py-[0.4rem] text-[0.9rem] font-semibold text-muted
                   select-none active:bg-raised"
            (click)="load()">
      Try again
    </button>
  }

  <!-- Null is "not fetched yet", which is not the same as an empty library. -->
  @if (loading()) {
    <p class="pt-3 text-[0.95rem] text-muted">Reading the library…</p>
  }

  <ul class="flex flex-col pt-2">
    @for (artist of artists(); track artist.name) {
      <li>
        <button class="flex min-h-[3.5rem] w-full cursor-pointer touch-manipulation items-center
                       gap-3 rounded-md px-2 py-2 text-left select-none active:bg-raised"
                (click)="open(artist)">
          <span class="grid size-12 flex-none place-items-center overflow-hidden rounded-full
                       bg-surface">
            @if (artOf(artist); as uri) {
              <!-- Lazy, with the box fixed by width/height: most of 487 rows are
                   off screen, and an undecoded picture costs nothing. -->
              <img class="h-full w-full object-cover" [src]="uri" alt=""
                   width="48" height="48" loading="lazy" decoding="async"
                   (error)="onArtError(uri)">
            } @else {
              <svg lucideUserRound class="size-5 text-muted" aria-hidden="true"></svg>
            }
          </span>
          <span class="min-w-0 flex-1">
            <span class="block truncate">{{ artist.name }}</span>
            <span class="block truncate text-[0.85rem] text-muted">
              {{ albumsLabel(artist) }}
            </span>
          </span>
        </button>
      </li>
    } @empty {
      @if (!loading() && !error()) {
        <li class="px-2 py-6 text-[0.95rem] text-muted">
          Nothing in the library. Has MPD finished scanning?
        </li>
      }
    }
  </ul>
</section>
