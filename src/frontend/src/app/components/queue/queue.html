@if (visible()) {
  <section class="relative min-h-dvh z-[1] mx-auto px-4 pb-8 min-[68rem]:min-h-0" aria-label="Queue">
    <div class="z-[1] flex gap-2 py-3" role="tablist">
      <button class="min-h-[2.75rem] flex-1 cursor-pointer touch-manipulation rounded-full
                     px-4 text-[0.95rem] font-semibold select-none"
              [class]="tab() === 'back' ? 'bg-raised text-text' : 'text-muted'"
              role="tab" [attr.aria-selected]="tab() === 'back'"
              (click)="tab.set('back')">
        Back to <span class="tabular-nums text-muted ms-2">({{ backTo().length }})</span>
      </button>
      <button class="min-h-[2.75rem] flex-1 cursor-pointer touch-manipulation rounded-full
                     px-4 text-[0.95rem] font-semibold select-none"
              [class]="tab() === 'next' ? 'bg-raised text-text' : 'text-muted'"
              role="tab" [attr.aria-selected]="tab() === 'next'"
              (click)="tab.set('next')">
        Up next <span class="tabular-nums text-muted ms-2">({{ upNext().length }})</span>
      </button>
      <!-- Outside the tabs' meaning but in their row, where there is room. -->
      <button type="button"
              class="grid size-11 flex-none cursor-pointer touch-manipulation place-items-center
                     rounded-full text-muted select-none active:bg-raised"
              aria-label="Save queue as playlist" aria-haspopup="dialog"
              (click)="saving.set(true)">
        <svg lucideListPlus class="size-5" aria-hidden="true"></svg>
      </button>
    </div>

    @if (error(); as message) {
      <p class="pb-2 text-[0.9rem] text-warn" role="alert">{{ message }}</p>
    }
    @if (notice(); as message) {
      <p class="pb-2 text-[0.9rem] text-muted" role="status">{{ message }}</p>
    }

    <ul class="flex flex-col">
      @for (row of rows(); track row.id ?? $index) {
        <li class="flex items-center gap-1">
          <button class="flex min-h-[3.5rem] min-w-0 flex-1 cursor-pointer touch-manipulation items-center
                         gap-3 rounded-md px-2 py-2 text-left select-none active:bg-raised"
                  (click)="play(row)">
            <!-- Lazy, with the box fixed by width/height: a long queue is
                 mostly off screen, and an unfetched cover costs nothing. -->
            <app-cover-art class="size-12 flex-none rounded bg-surface" [uri]="artOf(row)"
                           [width]="48" [height]="48" lazy thumb (failed)="onArtError($event)">
              @if (isCd(row)) {
                <svg lucideDisc3 class="size-5 text-muted" aria-hidden="true"></svg>
              } @else {
                <svg lucideMusic class="size-5 text-muted" aria-hidden="true"></svg>
              }
            </app-cover-art>
            <span class="min-w-0 flex-1">
              <span class="block truncate">{{ titleOf(row) }}</span>
              <span class="block truncate text-[0.85rem] text-muted">
                {{ row.artist || (isCd(row) ? 'Audio CD' : 'Unknown artist') }}
              </span>
            </span>
            <span class="flex-none text-[0.85rem] text-muted tabular-nums">
              {{ durationOf(row) }}
            </span>
          </button>
          <!-- A sibling, not inside the row: a button cannot hold a button. -->
          <button type="button"
                  class="-me-3 grid size-11 flex-none cursor-pointer touch-manipulation place-items-center
                         rounded-full text-muted select-none active:bg-raised"
                  aria-haspopup="dialog" [attr.aria-label]="'More for ' + titleOf(row)"
                  (click)="menuTrack.set(row)">
            <svg lucideEllipsisVertical class="size-5" aria-hidden="true"></svg>
          </button>
        </li>
      } @empty {
        <li class="px-2 py-6 text-[0.95rem] text-muted">
          @if (tab() === 'next') {
            Nothing up next — this is the last track.
          } @else {
            Nothing played yet.
          }
        </li>
      }
    </ul>
    <app-track-menu [(track)]="menuTrack" [actions]="trackActions" removeLabel="Remove from Queue"
                    (remove)="remove($event)" />
    <app-save-queue-dialog [(open)]="saving" (saved)="notice.set('Saved to “' + $event + '”')" />
  </section>
}
